name: Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "build/Release/UtaNoid Studio.exe" dist/
          windeployqt --release --no-translations --dir dist "dist/UtaNoid Studio.exe"
          Compress-Archive -Path dist/* -DestinationPath UtaNoid-Studio-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: UtaNoid-Studio-Windows
          path: UtaNoid-Studio-Windows.zip
          if-no-files-found: error
